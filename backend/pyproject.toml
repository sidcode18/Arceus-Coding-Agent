[project]
name = "ai-coding-agent-backend"
version = "0.1.0"
description = "AI Coding Agent Backend"
authors = [
    {name = "AI Coding Agent Team"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "qdrant-client==1.12.1",
    "redis>=5.0.3",
    "pika>=1.3.2",
    "celery>=5.3.4",
    "kombu>=5.3.4",
    "minio>=7.2.5",
    "authlib>=1.2.1",
    "python-multipart>=0.0.6",
    "langchain-google-genai==1.0.10",
    "langchain-text-splitters==0.2.4",
    "langgraph==0.4.0",
    "langchain-core==0.2.43",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "psycopg2-binary>=2.9.9",
    "GitPython>=3.1.42",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "websockets>=12.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that call real external services (Gemini, Qdrant, Postgres). Skipped in CI unless the corresponding env vars are set.",
]
