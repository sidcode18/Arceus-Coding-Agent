name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_coding_agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    - name: Install test dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio httpx
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ai_coding_agent
        REDIS_URL: redis://localhost:6379/0
        # GOOGLE_API_KEY intentionally NOT set — unit tests must pass without it.
        # Integration tests (marked with @pytest.mark.integration) are automatically
        # skipped when GOOGLE_API_KEY is absent.
      run: |
        cd backend
        PYTHONPATH=. pytest tests/ -m "not integration" -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install and Build
      run: |
        cd frontend
        npm ci
        npm run build
